[project]
name = "smgf-experiments"
version = "0.1.0"
description = "Simulation experiments for State-Modulated Guidance Field"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.scripts]
smgf = "smgf.cli:main"
smgf-tune-s4 = "smgf.tune_s4:main"
smgf-tune-s6 = "smgf.tune_s6_prediction:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smgf"]
